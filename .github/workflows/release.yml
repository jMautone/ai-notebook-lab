name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'  # Ejecuta cuando pusheas tags como v1.0.0, v2.1.3, etc.

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog
        id: changelog
        run: |
          # Obtener el tag anterior
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges ${PREVIOUS_TAG}..HEAD)
          fi
          
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## 🚀 Release ${{ github.ref_name }}
            
            ### 📚 AI Notebook Lab - Laboratorios de Inteligencia Artificial
            
            Este release incluye laboratorios prácticos para:
            - 🧠 LLM Fundamentals
            - 🗄️ Vector Databases
            - 🔗 RAG Pipeline
            - 🤖 Agents & Tools
            - 🚀 Advanced RAG Agents
            - 🌐 Model Context Protocol (MCP)
            - 🛠️ Custom MCP Servers
            - 🧪 Evals for AI Models
            - 📊 Monitoring with Langfuse
            
            ### Cambios en esta versión:
            ${{ steps.changelog.outputs.changes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
